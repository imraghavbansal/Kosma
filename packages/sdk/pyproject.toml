[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosma"
version = "0.1.0"
description = "Kosma Python SDK - trace AI agent executions for change impact analysis."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["kosma*"]
